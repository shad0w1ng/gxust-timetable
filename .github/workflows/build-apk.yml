name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备网页资源
        run: |
          set -e
          mkdir -p android/app/src/main/assets/www
          cp index.html          android/app/src/main/assets/www/
          cp manifest.json       android/app/src/main/assets/www/ 2>/dev/null || true
          cp sw.js               android/app/src/main/assets/www/ 2>/dev/null || true
          cp icon-192.png        android/app/src/main/assets/www/ 2>/dev/null || true
          cp icon-512.png        android/app/src/main/assets/www/ 2>/dev/null || true
          cp apple-touch-icon.png android/app/src/main/assets/www/ 2>/dev/null || true
          echo "--- assets/www ---"
          ls -la android/app/src/main/assets/www

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: gxust-timetable-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
